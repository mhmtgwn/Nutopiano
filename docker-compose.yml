services:
  postgres:
    image: postgres:16-alpine
    container_name: nutopiano-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutopiano
      POSTGRES_USER: nutopiano
      POSTGRES_PASSWORD: nutopiano
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutopiano -d nutopiano"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: nutopiano-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nutopiano-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://nutopiano:nutopiano@postgres:5432/nutopiano
      JWT_SECRET: CHANGE_ME_IN_DOCKER
      ALLOWED_ORIGINS: http://localhost:3000
      PUBLIC_BUSINESS_ID: 1
      SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: 0.1
    ports:
      - "3001:3001"
    command: >
      sh -c "until npx prisma migrate deploy; do echo 'waiting for db...'; sleep 2; done; npm run start:prod"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3001/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nutopiano-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: 0.1
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nutopiano-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.2.0
    container_name: nutopiano-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3003:3000"
    profiles:
      - observability

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
