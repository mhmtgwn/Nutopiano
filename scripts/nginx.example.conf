# Nutopiano - Example Nginx reverse proxy configuration
# Domains:
# - nutopiano.com / www.nutopiano.com -> Next.js (127.0.0.1:3000)
# - api.nutopiano.com -> Nest API (127.0.0.1:3001)
#
# Place this file under /etc/nginx/sites-available/nutopiano.conf
# and symlink to /etc/nginx/sites-enabled/.
# SSL (Let's Encrypt) config is not included; add `listen 443 ssl;` blocks as needed.
#
# If Cloudflare proxy is enabled:
# - Set real_ip_header to CF-Connecting-IP to preserve visitor IP in logs/app.
# - Keep API routes non-cacheable at Cloudflare layer.

upstream nutopiano_frontend {
  server 127.0.0.1:3000;
  keepalive 64;
}

upstream nutopiano_backend {
  server 127.0.0.1:3001;
  keepalive 64;
}

# Trust Cloudflare visitor IP header (keep this only behind Cloudflare/WAF).
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
  listen 80;
  server_name nutopiano.com www.nutopiano.com;

  client_max_body_size 25m;

  location / {
    proxy_pass http://nutopiano_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Public static assets can be cached aggressively by CDN.
  location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    proxy_pass http://nutopiano_frontend;
  }
}

server {
  listen 80;
  server_name api.nutopiano.com;

  client_max_body_size 25m;

  location / {
    proxy_pass http://nutopiano_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    add_header Cache-Control "no-store";
  }

  location /uploads/ {
    proxy_pass http://nutopiano_backend;
    expires 7d;
    add_header Cache-Control "public";
  }
}
