name: Security Audit

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit (prod deps, high+)
        run: npm run security:audit
