name: Security Audit

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  npm-audit:
    name: NPM Audit (high+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit (prod deps, high+)
        run: npm run security:audit

  snyk:
    name: Snyk Scan (high+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Skip Snyk (token not configured)
        if: ${{ secrets.SNYK_TOKEN == '' }}
        run: echo "SNYK_TOKEN is not configured. Skipping Snyk scan."

      - name: Run Snyk test (high+)
        if: ${{ secrets.SNYK_TOKEN != '' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx snyk test --all-projects --severity-threshold=high

      - name: Publish Snyk monitor snapshot
        if: github.event_name == 'push' && secrets.SNYK_TOKEN != ''
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx snyk monitor --all-projects
