name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  backend:
    name: Backend Lint Test Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Backend Lint
        run: npm run lint -w backend

      - name: Backend Test
        run: npm run test -w backend -- --passWithNoTests --runInBand

      - name: Backend Build
        run: npm run build -w backend

  frontend:
    name: Frontend Lint Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Frontend Lint
        run: npm run lint -w frontend

      - name: Frontend Build
        run: npm run build -w frontend
